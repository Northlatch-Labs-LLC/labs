# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# labs — release builds. Run locally: `goreleaser release --clean` on a tag. No CI publishes this.
version: 2

builds:
  - id: labs
    env:
      - CGO_ENABLED=0
    tags:
      - goolm
      - stdjson
    ldflags:
      - -s -w
      - -X github.com/Northlatch-Labs-LLC/labs/pkg/config.Version={{ .Version }}
      - -X github.com/Northlatch-Labs-LLC/labs/pkg/config.GitCommit={{ .ShortCommit }}
      - -X github.com/Northlatch-Labs-LLC/labs/pkg/config.BuildTime={{ .Date }}
      - -X github.com/Northlatch-Labs-LLC/labs/pkg/config.GoVersion={{ with index .Env "GOVERSION" }}{{ . }}{{ else }}unknown{{ end }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/labs

archives:
  - id: labs
    formats: [tar.gz]
    name_template: "labs_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "labs_{{ .Version }}_checksums.txt"

release:
  github:
    owner: Northlatch-Labs-LLC
    name: labs
  draft: true
